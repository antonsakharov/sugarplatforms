name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - name: Package repository snapshot
        if: always()
        run: |
          rm -rf .git node_modules .next
          zip -r sugar-platform-diagnostic-${{ github.run_id }}.zip . -x '*.DS_Store'
      - name: Upload repository snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sugar-platform-diagnostic-${{ github.run_id }}
          path: sugar-platform-diagnostic-${{ github.run_id }}.zip
          if-no-files-found: error
          retention-days: 14
